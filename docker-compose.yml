
services:
  # MySQL cho Auth & Customer Service
  mysql:
    image: mysql:8.0
    container_name: gara-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gara_core_db
      MYSQL_USER: gara_user
      MYSQL_PASSWORD: garapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gara-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB cho Repair & Inventory Service
  mongo-db:
    image: mongo:8.0
    container_name: gara-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gara-network
    healthcheck: # <--- Bắt buộc phải có khối này và thẳng hàng với networks
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-db:
    image: postgres:16-alpine
    container_name: gara-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: customer_vehicle_db
    ports:
      - "5432:5432"
    networks:
      - gara-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d customer_vehicle_db" ]
      interval: 10s
      timeout: 5s
      retries: 5


  eureka-service:
    build:
      context: ./backend-services/eureka-service
    container_name: eureka-service
    ports:
      - "8761:8761"
    networks:
      - gara-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend-services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    networks:
      - gara-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend-services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - gara-network
    depends_on:
      eureka-service:
        condition: service_healthy

  repair-service:
    build:
      context: ./backend-services/repair-service
    container_name: repair-service
    ports:
      - "8082:8082"
    environment: # <--- Bổ sung khối này
      - SPRING_MONGODB_URI=mongodb://mongoadmin:123456@mongo-db:27017/gara_business_db?authSource=admin
    networks:
      - gara-network
    depends_on:
      eureka-service:
        condition: service_healthy
      mongo-db:
        condition: service_healthy

  customer-service:
    build:
      context: ./backend-services/customer-service # Sửa lại đường dẫn này nếu thư mục của bạn nằm trong backend-services
    container_name: customer-service
    ports:
      - "8083:8083"
    environment:
      # Biến này sẽ đè nát chữ 'localhost' trong file application.yml, ép nó gọi vào container postgres-db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/customer_vehicle_db
    networks:
      - gara-network
    depends_on:
      eureka-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  inventory-service:
    build:
      context: ./backend-services/inventory-service # Đường dẫn chuẩn tới thư mục chứa Dockerfile của service kho
    container_name: inventory-service
    ports:
      - "8084:8084"
    environment:
      # Ép Spring Boot gọi vào container tên là gara-mysql trong mạng nội bộ Docker thay vì localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://gara-mysql:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      # Ép Eureka Client đăng ký thông qua tên container eureka-service
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    networks:
      - gara-network
    depends_on:
      eureka-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
  mongo-data:

networks:
  gara-network:
    driver: bridge