name: Backend CI Pipeline

on:
  push:
    branches: [ "master", "develop" ]
    paths:
      - 'backend-services/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "master", "develop" ]
    paths:
      - 'backend-services/**'

jobs:
  # BƯỚC 1: Phát hiện chính xác Service nào bị thay đổi code
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'backend-services/api-gateway/**'
            auth-service: 'backend-services/auth-service/**'
            billing-service: 'backend-services/billing-service/**'
            customer-service: 'backend-services/customer-service/**'
            eureka-service: 'backend-services/eureka-service/**'
            inventory-service: 'backend-services/inventory-service/**'
            notification-service: 'backend-services/notification-service/**'
            repair-service: 'backend-services/repair-service/**'

  # BƯỚC 2: Build & Push SONG SONG (Chỉ chạy cho những service có thay đổi)
  build-and-push:
    needs: detect-changes
    # Chỉ chạy job này nếu mảng services không rỗng (có ít nhất 1 service thay đổi)
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      # Matrix tự động tạo N máy ảo song song tương ứng với N service bị thay đổi
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
      # Không hủy các máy ảo khác nếu có 1 máy bị lỗi
      fail-fast: false
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Microservice (${{ matrix.service }})
        run: |
          cd backend-services/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Chạy Unit Tests
        # Chỉ chạy test cho 2 service cốt lõi theo cấu hình cũ của bạn
        if: matrix.service == 'auth-service' || matrix.service == 'repair-service'
        run: |
          cd backend-services/${{ matrix.service }}
          mvn test

      - name: Đăng nhập vào Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Docker Image (${{ matrix.service }})
        if: github.ref == 'refs/heads/master'
        run: |
          cd backend-services/${{ matrix.service }}
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/gara-${{ matrix.service }}:latest"
          
          echo "Đang đóng gói và đẩy Image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
