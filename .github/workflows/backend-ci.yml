name: Backend CI Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # BƯỚC 1: Dịch toàn bộ Code ra file .jar (Dành cho cả master và develop)
    - name: Compile tất cả Microservices (Maven Build)
      run: |
        SERVICES=("api-gateway" "auth-service" "billing-service" "customer-service" "eureka-service" "inventory-service" "notification-service" "repair-service")
        for SERVICE in "${SERVICES[@]}"; do
          echo "Đang Build $SERVICE..."
          cd backend-services/$SERVICE
          mvn clean package -DskipTests
          cd ../..
        done

    # BƯỚC 2: Chạy các bài Test cốt lõi
    - name: Chạy Unit Tests
      run: |
        cd backend-services/auth-service && mvn test
        cd ../../backend-services/repair-service && mvn test

    # BƯỚC 3 & 4: (Chỉ chạy trên nhánh master) Đăng nhập và Đẩy Image lên Docker Hub
    - name: Đăng nhập vào Docker Hub
      if: github.ref == 'refs/heads/master'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build và Push 8 Docker Images
      if: github.ref == 'refs/heads/master'
      run: |
        SERVICES=("api-gateway" "auth-service" "billing-service" "customer-service" "eureka-service" "inventory-service" "notification-service" "repair-service")
        for SERVICE in "${SERVICES[@]}"; do
          echo "Đang đóng gói và đẩy Image cho $SERVICE..."
          cd backend-services/$SERVICE
          
          # Đặt tên Image theo chuẩn: username/gara-tên_service:latest
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/gara-$SERVICE:latest"
          
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          
          cd ../..
        done
