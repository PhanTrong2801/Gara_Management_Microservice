server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "https://app.gara-autoflow.online"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          # Cấu hình định tuyến và bộ lọc
          routes:
            # 1. Tuyến đường cho User Management (Bắt buộc có Token)
            - id: auth-service-users
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/users/**
              filters:
                - AuthenticationFilter

            # 2. Tuyến đường cho Auth Service (Mở cửa tự do - Login/Register)
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            # 2. Tuyến đường cho Repair Service (Bắt buộc có Token)
            - id: repair-service
              uri: lb://repair-service
              predicates:
                - Path=/api/repair/**
              filters:
                - AuthenticationFilter

            # 3. Inventory Service
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - AuthenticationFilter

            #4. Customer Service
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AuthenticationFilter

            


            #5. Billing Service
            - id: billing-service
              uri: lb://billing-service
              predicates:
                - Path=/api/billing/**
              filters:
                - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}